services:
  backend:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000"]
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@postgres:5432/${POSTGRES_DB:-trading}
      REDIS_URL: redis://redis:6379/0
      BROKER_MODE: paper
      ENABLE_TRADING: ${ENABLE_TRADING:-false}
      ENABLE_LIVE_TRADING: "false"
      RISK_PER_TRADE: ${RISK_PER_TRADE:-0.01}
      MAX_POSITION_FRACTION: ${MAX_POSITION_FRACTION:-0.10}
      MAX_PORTFOLIO_EXPOSURE_FRACTION: ${MAX_PORTFOLIO_EXPOSURE_FRACTION:-0.80}
      MAX_OPEN_POSITIONS: ${MAX_OPEN_POSITIONS:-10}
      MAX_DAILY_LOSS_FRACTION: ${MAX_DAILY_LOSS_FRACTION:-0.02}
      MAX_DRAWDOWN_FRACTION: ${MAX_DRAWDOWN_FRACTION:-0.15}
      SYMBOL_COOLDOWN_SECONDS: ${SYMBOL_COOLDOWN_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
